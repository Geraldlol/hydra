version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns:
          - "*"
    # Major bumps for @types/node and TypeScript are deliberate decisions.
    # @types/vscode is pinned exactly to the minimum engines.vscode API, so
    # every update must be coordinated manually with that compatibility floor.
    # Patch and minor bumps for the remaining dependencies flow normally.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/vscode"
        # Suppress routine version PRs without suppressing security updates.
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
